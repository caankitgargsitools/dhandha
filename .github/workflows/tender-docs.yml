# Manual fallback / debugging only: fetches tender documents for the tender assistant from GitHub's (US) machines.
# The main document worker is the AWS Mumbai server (crawler/src/server.js → docs.js --forever); there is no schedule
# here, so two workers never claim the same jobs and captcha sessions. Run it by hand (Actions → tender docs → Run
# workflow) only while the server is down, or to probe a tender page. Captchas go to Dhandha's admin captcha desk and
# a person types them; nothing is solved automatically.
name: tender docs

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Only probe a tender page's document links (no jobs)"
        type: boolean
        default: false
      only:
        description: "Probe: portals whose name contains (comma separated)"
        default: "CPPP"

concurrency:
  group: tender-docs-${{ github.event.inputs.probe == 'true' && 'probe' || 'worker' }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
      options: --shm-size=1g
    env:
      SUPABASE_URL: https://umyesrpibsdgzsrqfvqf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_b1_jKTEARE2OINvUDaM62g_Q5JxoB6w
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
      RUNNER_NAME: github-actions-docs
      ONLY_PORTALS: ${{ github.event.inputs.only || 'CPPP' }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: crawler
      - name: Install
        working-directory: crawler
        run: npm install --omit=dev --no-audit --no-fund
      - name: Fetch queued documents
        if: github.event.inputs.probe != 'true'
        working-directory: crawler
        run: node src/docs.js --forever --hours 5.75
      - name: Probe a tender page
        if: github.event.inputs.probe == 'true'
        working-directory: crawler
        run: node src/probe.js
